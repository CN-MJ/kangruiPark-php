<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>微信授权</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fb; color: #142033; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 48px 24px; text-align: center; }
    .card { background: #fff; border-radius: 16px; padding: 28px 20px; box-shadow: 0 8px 24px rgba(20,32,51,.06); }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { margin: 0; font-size: 14px; color: #64748b; line-height: 1.6; }
    .ok { color: #15803d; font-weight: 600; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="title">请使用服务端授权页</h1>
      <p id="msg">推荐访问 <code>/wechat/auth</code>（由 Laravel 注入 AppID）。本静态页仅作备用入口说明。</p>
    </div>
  </div>
  <script>
    // 备用：把当前参数转到 Blade 授权页
    (function () {
      var q = window.location.search || '';
      window.location.replace('/wechat/auth' + q);
    })();
  </script>
</body>
</html>
